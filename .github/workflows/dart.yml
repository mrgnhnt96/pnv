name: dart

on:
  push:
    branches: [main]
    paths:
      - "dart/**"
      - "spec/**"
      - ".github/workflows/dart.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format . --set-exit-if-changed
      - run: dart analyze --fatal-infos --fatal-warnings
      - run: dart test
